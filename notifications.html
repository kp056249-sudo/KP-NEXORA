{% extends "base.html" %}
{% block content %}<div class="page-head"><div><div class="eyebrow">SYSTEM STATUS</div><h1 class="h1">Notifications</h1><p class="sub">Workspace events and system updates.</p></div><form method="post"><button class="btn primary">Mark All as Read</button></form></div><div class="card">{% for n in notifications %}<div class="activity-item"><div class="dot">{{ '✓' if n['is_read'] else '!' }}</div><div><b>{{n['title']}}</b><br><small class="muted">{{n['detail']}} · {{n['created_at']}}</small></div></div>{% else %}<div class="empty">No notifications.</div>{% endfor %}</div>{% endblock %}
