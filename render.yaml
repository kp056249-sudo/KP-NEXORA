services:
  - type: web
    name: kp-nexora
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kp-nexora-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/kp_nexora_uploads
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_WEB_SEARCH
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: kp-nexora-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
    diskSizeGB: 5
