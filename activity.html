{% extends "base.html" %}
{% block content %}<div class="page-head"><div><div class="eyebrow">AUDIT TRAIL</div><h1 class="h1">Activity</h1><p class="sub">A real record of actions in this workspace.</p></div></div><div class="card">{% for x in activities %}<div class="activity-item"><div class="dot">◷</div><div><b>{{x['title']}}</b><br><small class="muted">{{x['detail']}} · {{x['created_at']}}</small></div></div>{% else %}<div class="empty">No activity yet.</div>{% endfor %}</div>
{% endblock %}
